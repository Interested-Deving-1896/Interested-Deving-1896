name: Build and deploy documentation

on:
  pull_request:
    paths:
      - 'README.md'
      - 'DOCS/**'
      - 'characters/**'
      - '.gitbook.yaml'
      - 'book.toml'
      - 'scripts/check_rendered_links.py'
      - '.github/workflows/docs.yml'
  push:
    branches: [main]
    paths:
      - 'README.md'
      - 'DOCS/**'
      - 'characters/**'
      - '.gitbook.yaml'
      - 'book.toml'
      - 'scripts/check_rendered_links.py'
      - '.github/workflows/docs.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: documentation-${{ github.ref }}
  cancel-in-progress: true

env:
  MDBOOK_VERSION: '0.4.40'

jobs:
  build:
    name: Build mdBook
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7

      - name: Validate documentation sources
        run: |
          test -f .gitbook.yaml
          test -f book.toml
          test -f DOCS/README.md
          test -f DOCS/SUMMARY.md

      - name: Cache mdBook
        uses: actions/cache@2c8a9bd7457de244a408f35966fab2fb45fda9c8 # v6
        with:
          path: |
            ~/.cargo/bin/mdbook
            ~/.cargo/.crates.toml
            ~/.cargo/.crates2.json
          key: mdbook-${{ runner.os }}-${{ env.MDBOOK_VERSION }}

      - name: Install mdBook
        run: |
          if ! command -v mdbook >/dev/null || [[ "$(mdbook --version)" != *"$MDBOOK_VERSION"* ]]; then
            cargo install mdbook --version "$MDBOOK_VERSION" --locked
          fi

      - name: Build documentation
        run: mdbook build

      - name: Validate rendered documentation links
        run: >-
          python3 scripts/check_rendered_links.py book
          --site-prefix /OpenOS-Project-OSP/

      - name: Upload GitHub Pages artifact
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5
        with:
          path: book

  deploy:
    name: Deploy GitHub Pages
    if: github.event_name != 'pull_request'
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 5
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@cd2ce8fcbc39b97be8ca5fce6e763baed58fa128 # v5
