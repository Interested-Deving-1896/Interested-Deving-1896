name: Accessibility barrier
description: Report difficulty using or understanding profile content or documentation.
title: "[Accessibility]: "
labels:
  - accessibility
  - documentation
body:
  - type: input
    id: location
    attributes:
      label: Affected page or file
    validations:
      required: true
  - type: textarea
    id: barrier
    attributes:
      label: Barrier encountered
      description: Describe what prevented or complicated access. Do not include private medical information.
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected result
    validations:
      required: true
  - type: input
    id: environment
    attributes:
      label: Browser or assistive technology
      description: Optional; include versions only when useful.
  - type: textarea
    id: suggestion
    attributes:
      label: Suggested improvement
      description: Optional.
