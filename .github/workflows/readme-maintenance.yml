name: README maintenance proposals

on:
  workflow_dispatch:
    inputs:
      mode:
        description: Maintenance operation
        required: true
        default: staleness
        type: choice
        options:
          - staleness
          - reconcile
          - translate
          - ai-draft
      language:
        description: Language tag for translation mode
        required: false
        default: de
        type: string
      instructions:
        description: Optional guidance for AI draft mode
        required: false
        type: string
      open_pull_request:
        description: Open a pull request when content changes
        required: false
        default: true
        type: boolean

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: readme-maintenance-${{ github.repository }}
  cancel-in-progress: false

jobs:
  propose:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      MODE: ${{ inputs.mode }}
      LANGUAGE: ${{ inputs.language }}
      INSTRUCTIONS: ${{ inputs.instructions }}
      README_AI_ENDPOINT: ${{ vars.README_AI_ENDPOINT }}
      README_AI_TOKEN: ${{ secrets.README_AI_TOKEN }}
      README_AI_MODEL: ${{ vars.README_AI_MODEL }}
    steps:
      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7
        with:
          fetch-depth: 0
          token: ${{ secrets.README_MAINTENANCE_TOKEN || github.token }}

      - name: Generate report or proposal
        id: generate
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p readme-maintenance
          case "$MODE" in
            staleness)
              python3 scripts/readme_policy.py staleness \
                | tee readme-maintenance/staleness.txt
              echo "proposal=" >> "$GITHUB_OUTPUT"
              ;;
            reconcile)
              python3 scripts/readme_policy.py reconcile \
                --output README.proposed.md
              echo "proposal=README.proposed.md" >> "$GITHUB_OUTPUT"
              ;;
            translate)
              if [[ ! "$LANGUAGE" =~ ^[a-z]{2,3}(-[A-Za-z0-9]{2,8})?$ ]]; then
                echo "Invalid language tag: $LANGUAGE" >&2
                exit 1
              fi
              python3 scripts/readme_ai.py translate \
                --language "$LANGUAGE" \
                --instructions "$INSTRUCTIONS" \
                --output "README.$LANGUAGE.md"
              echo "proposal=README.$LANGUAGE.md" >> "$GITHUB_OUTPUT"
              ;;
            ai-draft)
              python3 scripts/readme_ai.py draft \
                --instructions "$INSTRUCTIONS" \
                --output README.proposed.md
              python3 scripts/readme_policy.py \
                --readme README.proposed.md quality \
                --report readme-maintenance/quality.json
              echo "proposal=README.proposed.md" >> "$GITHUB_OUTPUT"
              ;;
            *)
              echo "Unsupported mode: $MODE" >&2
              exit 1
              ;;
          esac

      - name: Summarize maintenance result
        env:
          PROPOSAL: ${{ steps.generate.outputs.proposal }}
        run: |
          {
            echo "## README maintenance"
            echo
            echo "- Mode: \`$MODE\`"
            if [[ -n "$PROPOSAL" ]]; then
              echo "- Proposal: \`$PROPOSAL\`"
            else
              echo "- Result: report only; no repository changes requested"
            fi
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload report or proposal
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: readme-maintenance-${{ inputs.mode }}-${{ github.run_id }}
          path: |
            readme-maintenance/
            README.proposed.md
            README.*.md
          retention-days: 14
          if-no-files-found: error

      - name: Open proposal pull request
        if: inputs.open_pull_request && inputs.mode != 'staleness'
        env:
          GH_TOKEN: ${{ secrets.README_MAINTENANCE_TOKEN || github.token }}
          CUSTOM_MAINTENANCE_TOKEN: ${{ secrets.README_MAINTENANCE_TOKEN }}
          PROPOSAL: ${{ steps.generate.outputs.proposal }}
        run: |
          set -euo pipefail
          if [[ "$MODE" == "translate" ]]; then
            destination="README.$LANGUAGE.md"
          else
            destination="README.md"
          fi
          cp "$PROPOSAL" "$destination"
          if [[ "$destination" == "README.md" ]]; then
            python3 scripts/readme_policy.py quality \
              --report readme-maintenance/final-quality.json
          fi
          git add "$destination"
          if git diff --cached --quiet; then
            echo "No README changes were proposed." >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          if [[ -z "$CUSTOM_MAINTENANCE_TOKEN" ]]; then
            can_create_pr=$(gh api \
              "repos/$GITHUB_REPOSITORY/actions/permissions/workflow" \
              --jq '.can_approve_pull_request_reviews')
            if [[ "$can_create_pr" != "true" ]]; then
              echo "::notice::Proposal retained as an artifact. Configure README_MAINTENANCE_TOKEN to open pull requests without broadening the repository-wide Actions permission."
              echo "- Pull request: skipped; \`README_MAINTENANCE_TOKEN\` is not configured" >> "$GITHUB_STEP_SUMMARY"
              exit 0
            fi
          fi
          branch="automation/readme-$MODE-${GITHUB_RUN_ID}"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git switch -c "$branch"
          git commit -m "docs: propose README $MODE update"
          git push origin "$branch"
          gh pr create \
            --base "$GITHUB_REF_NAME" \
            --head "$branch" \
            --title "docs: propose README $MODE update" \
            --body "Generated by the repository's README maintenance workflow. Review and merge manually."
