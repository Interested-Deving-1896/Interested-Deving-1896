name: Verify organization README drift

on:
  schedule:
    - cron: '23 5 * * 1'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: verify-organization-readmes
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7

      - name: Validate canonical templates
        run: python3 scripts/profile_readmes.py validate

      - name: Compare all destination files
        env:
          PROFILE_SYNC_TOKEN: ${{ secrets.PROFILE_SYNC_TOKEN || github.token }}
        run: python3 scripts/profile_readmes.py sync --check
