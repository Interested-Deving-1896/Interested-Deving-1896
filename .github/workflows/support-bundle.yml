name: Sanitized support bundle

on:
  workflow_dispatch:
    inputs:
      retention_days:
        description: Artifact retention period
        required: true
        default: '3'
        type: choice
        options: ['1', '3', '7']

permissions:
  actions: read
  contents: read

jobs:
  bundle:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7
        with:
          persist-credentials: false

      - name: Collect public diagnostic metadata
        env:
          REPOSITORY: ${{ github.repository }}
          RUN_ID: ${{ github.run_id }}
        run: |
          set -euo pipefail
          bundle_dir="$RUNNER_TEMP/repository-support"
          mkdir -p "$bundle_dir"
          {
            echo "repository=$REPOSITORY"
            echo "run_id=$RUN_ID"
            echo "commit=$(git rev-parse HEAD)"
            echo "default_branch=${GITHUB_REF_NAME}"
          } > "$bundle_dir/metadata.txt"
          find . -maxdepth 4 -type f -not -path './.git/*' -printf '%P\n' \
            | LC_ALL=C sort > "$bundle_dir/files.txt"
          find .github/workflows -maxdepth 1 -type f -printf '%f\n' 2>/dev/null \
            | LC_ALL=C sort > "$bundle_dir/workflows.txt"
          git log -20 --date=iso-strict --pretty='format:%h %ad %s' \
            > "$bundle_dir/recent-commits.txt"
          tar -czf "$RUNNER_TEMP/repository-support.tar.gz" -C "$RUNNER_TEMP" repository-support
          sha256sum "$RUNNER_TEMP/repository-support.tar.gz" \
            > "$RUNNER_TEMP/repository-support.tar.gz.sha256"

      - name: Upload support bundle
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: repository-support-${{ github.run_id }}
          path: |
            ${{ runner.temp }}/repository-support.tar.gz
            ${{ runner.temp }}/repository-support.tar.gz.sha256
          retention-days: ${{ inputs.retention_days }}
          if-no-files-found: error
