      <path d="M-72 342H-4M4 342H72" stroke="#0f172a" stroke-width="20" stroke-linecap="round"/>
      <g transform="translate(0 -23)">
        <circle cx="-25" cy="0" r="9" fill="#f4b942" stroke="#f8fafc" stroke-width="3"/>
        <circle cx="0" cy="0" r="9" fill="#36c5f0" stroke="#f8fafc" stroke-width="3"/>
        <circle cx="25" cy="0" r="9" fill="#a78bfa" stroke="#f8fafc" stroke-width="3"/>
        <path d="M-16 0H-9M9 0H16" stroke="#f8fafc" stroke-width="3"/>
      </g>
