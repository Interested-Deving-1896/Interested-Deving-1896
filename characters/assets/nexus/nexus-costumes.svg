      <path d="M92-50L145 40L105 72L66 18" fill="#1e293b" stroke="#e5e7eb" stroke-width="9" stroke-linejoin="round"/>
      <path d="M-76-58Q0-88 76-58L104 222Q0 266-104 222Z" fill="url(#coat)" stroke="#e5e7eb" stroke-width="9"/>
      <path d="M0-54V220M-70 30Q0 62 70 30M-86 132Q0 168 86 132" fill="none" stroke="currentColor" stroke-width="7" stroke-linecap="round" opacity="0.9"/>
