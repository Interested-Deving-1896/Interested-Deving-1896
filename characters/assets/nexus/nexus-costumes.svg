      <path d="M-70 84C-30 35-58-18-12-46C30-72 26-5 70-56" fill="none" stroke-width="8" stroke-linecap="round"/>
      <circle cx="-70" cy="84" r="11"/>
      <circle cx="-45" cy="28" r="11"/>
      <circle cx="-12" cy="-46" r="11"/>
      <circle cx="25" cy="-9" r="11"/>
      <circle cx="70" cy="-56" r="11"/>
      <path d="M-48 114L-18 82L17 109L57 73" fill="none" stroke="#c4b5fd" stroke-width="7" stroke-linecap="round"/>
    </g>
  </g>
  <text x="1250" y="790" text-anchor="middle" font-family="system-ui, sans-serif" font-size="30" font-weight="700" fill="#5b21b6">Ecosystem Wayfinder</text>
  <text x="1250" y="824" text-anchor="middle" font-family="system-ui, sans-serif" font-size="17" fill="#4c1d95">Map · introduce · connect with consent</text>

  <g transform="translate(750 870)">
    <circle cx="-34" cy="0" r="10" fill="#f4b942"/>
    <circle cx="0" cy="0" r="10" fill="#36c5f0"/>
    <circle cx="34" cy="0" r="10" fill="#a78bfa"/>
    <path d="M-24 0H-10M10 0H24" stroke="#475569" stroke-width="4"/>
