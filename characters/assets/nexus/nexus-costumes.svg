<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1500 900" role="img" aria-labelledby="title desc">
  <title id="title">Nexus digital cosplay costume reference sheet</title>
  <desc id="desc">Three face-neutral Nexus costumes: amber Source Weaver with notebook threads, cyan Mirror Keeper with comparison prism, and violet Ecosystem Wayfinder with connected star map.</desc>
  <defs>
