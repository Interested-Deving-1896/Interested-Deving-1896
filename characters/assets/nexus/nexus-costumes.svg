  </g>
  <text x="250" y="790" text-anchor="middle" font-family="system-ui, sans-serif" font-size="30" font-weight="700" fill="#7c4a03">Source Weaver</text>
  <text x="250" y="824" text-anchor="middle" font-family="system-ui, sans-serif" font-size="17" fill="#713f12">Build · document · invite inspection</text>

