  <text x="750" y="108" text-anchor="middle" font-family="system-ui, sans-serif" font-size="19" fill="#475569">Face-neutral · body-neutral · constructive tools · no real-world insignia</text>

  <g transform="translate(250 385)" color="#f4b942" filter="url(#shadow)">
    <rect x="-205" y="-245" width="410" height="610" rx="34" fill="#fff7df" stroke="#f4b942" stroke-width="5"/>
