    <use href="#nexus-base"/>
    <g transform="translate(137 92)">
      <path d="M0-73L65-37L65 37L0 73L-65 37L-65-37Z" fill="#cffafe" fill-opacity="0.72" stroke="#0891b2" stroke-width="7"/>
