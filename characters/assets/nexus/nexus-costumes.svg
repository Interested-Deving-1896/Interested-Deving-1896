  <text x="750" y="824" text-anchor="middle" font-family="system-ui, sans-serif" font-size="17" fill="#164e63">Verify · restore · hand onward</text>

  <g transform="translate(1250 385)" color="#a78bfa" filter="url(#shadow)">
    <rect x="-205" y="-245" width="410" height="610" rx="34" fill="#f4efff" stroke="#8b5cf6" stroke-width="5"/>
